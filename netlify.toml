# Configuration Netlify — optimisation de la consommation (bande passante / functions).
# Le build Next.js est géré automatiquement par le runtime Netlify Next ; on
# n'ajoute ici que des en-têtes de cache pour les assets statiques servis
# depuis /public. (Les variantes next/image sont, elles, mises en cache via
# images.minimumCacheTTL dans next.config.ts.)

# Images statiques dans /public/images : contenu stable, nom de fichier fixe.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PDF (carte des vins) : gros fichier téléchargé tel quel → cache long.
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icônes / manifeste / SVG statiques.
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[build.environment]
  # Next 16.3 : le cache Turbopack écrit les valeurs des variables d'environnement
  # dans ses fichiers .sst ; le scanner de secrets les lit dans la copie du Runtime
  # (.netlify/.next/cache) et fait échouer le build. Ce cache n'est jamais servi.
  # Posé préventivement sur tout le parc (2026-09-04) avant l'arrivée de 16.3 ici.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"
