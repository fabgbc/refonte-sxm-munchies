name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-check:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  auto-merge:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Récupérer les métadonnées Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approuver la PR (minor/patch uniquement)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Activer auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        # Only the monthly grouped PR and fixes to direct production dependencies
        # trigger a Netlify deploy (~15 credits). The rest (indirect or dev
        # dependencies, GitHub Actions) gets [skip ci] and goes live with the next deploy.
        run: |
          SUBJECT="$PR_TITLE (#$PR_NUMBER)"
          if [ "$ECOSYSTEM" = "github_actions" ] || { [ -z "$GROUP" ] && [ "$DEP_TYPE" != "direct:production" ]; }; then
            SUBJECT="$SUBJECT [skip ci]"
          fi
          gh pr merge --squash --subject "$SUBJECT" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
          DEP_TYPE: ${{ steps.metadata.outputs.dependency-type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
